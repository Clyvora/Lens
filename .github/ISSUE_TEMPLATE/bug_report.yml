name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach private files or paste sensitive contents. Use a small synthetic example.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the app
        2. Load this synthetic example…
        3. Choose…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox, Chrome, Safari…
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows, macOS, Linux…
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or a minimal synthetic sample if useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private, personal, and proprietary data from this report.
          required: true
